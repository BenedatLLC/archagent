# Product scope only: the shipped Observability Studio, not the eval scaffolding.
# Excluded deliberately — pytest-codex-evals/ (reusable pytest plugin), evals/ (fixture
# services and cases), examples/. They are real machinery but they are how the repo is
# tested, not what it ships.
#
# NOTE: observer/ is Go, which archagent does not analyse. It is the core of the system and
# is described in the artifact, but the import graph, `check` and evaluate's structural
# families see none of it. docs/architecture/constitution.md states this.
[project]
languages = ["python", "typescript"]
architecture_dir = "docs/architecture"

[python]
source_paths = ["skills"]
test_command = "pytest"

[ts]
source_paths = ["observer/client/src", "extension/src"]
test_command = "npm test"
