# Ground truth for the blind comparison (design §10).
#
# These verdicts come from the corpus pass recorded in
# `research/architecture-agent/feedback/probe-results.md`, where every group-F finding was labelled by
# reading the cited code. They are the part of a report that is checkable rather than a matter of taste:
# a good report must dismiss an intended family *with a reason*, and must not dismiss a real one.
#
# Only findings whose verdict was unambiguous on review are listed. A finding I was unsure about is not
# ground truth, and padding this file would make the measure look stronger than it is.

