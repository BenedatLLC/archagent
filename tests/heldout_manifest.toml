# The held-out set for the defect study (design §7.1).
#
# Disjoint from every repository used for tuning or regression: django, litellm, opencode, OpenHands,
# datasette, vue-core and my-research-assistant have all been read while building or calibrating the
# checks, so none of them can produce an unbiased number.
#
# Selection criteria, fixed before any run: several years of history, a public issue tracker with bug
# labels, a mix of commit conventions, at least one non-Python project, and no prior contact with
# archagent.
#
# PINNED ONCE AND NOT CHANGED AFTER A RUN. Quietly swapping a held-out repository when the numbers
# disappoint is the usual way a held-out set stops being held out.
#
# `head` is the end of the outcome window and `cutoff_months` its length, so the window is fixed rather
# than growing with the calendar — two runs a month apart must produce the same number.
#
# MINIMUM POWER, decided in advance (`detection_rate` in tests/defect_study.py simulates this design's own
# estimator and interval at a known effect size):
#
#     flagged / controls      detects a 1.5x effect
#         10 /  12                    23%     <- run 1 (poetry)
#         13 /  26                    28%     <- run 1 (scrapy)
#         30 /  60                    54%
#         60 / 120                    82%     <- the bar
#        120 / 240                   100%
#
# A repository enters a run only if it is expected to leave >= 60 flagged files and >= 120 controls after
# stratification. Run 1 shipped without this and its null result carried no information as a result.
#
# REVISED AFTER RUN 3 — the bar above counts the wrong thing. For a count outcome the binding constraint
# is *events*, not files: nova cleared the file bar within one file (59 of 60) and still returned
# RR 4.45 [1.63, 16.14], because its window held only 28 defect-fixing commits. Simulating by event count:
#
#     defect-fix events on scored files      detects a 1.5x effect
#              ~27                                    49%     <- nova
#              ~54                                    69%
#             ~108                                    95-99%  <- the bar
#             ~216                                   100%
#
# From run 4 on: >= 100 defect-fixing commit-touches on scored files in the outcome window, AND enough
# files (>= 60 flagged / >= 120 controls) for stratification to have anything to compare. Both, not either.

cutoff_months = 12

[[repo]]
name = "flask"
url = "https://github.com/pallets/flask"
head = "3.1.3"
paths = { python = ["src/flask"] }
# free-form subjects, squash-merged PRs

[[repo]]
name = "poetry"
url = "https://github.com/python-poetry/poetry"
head = "2.4.1"
paths = { python = ["src/poetry"] }
# conventional commits

[[repo]]
name = "scrapy"
url = "https://github.com/scrapy/scrapy"
head = "2.17.0"
paths = { python = ["scrapy"] }
# long history, issue-reference style

[[repo]]
name = "prettier"
url = "https://github.com/prettier/prettier"
head = "3.9.6"
paths = { ts = ["src"] }
# the non-Python entry

# --- run 2 (2026-08-01) -------------------------------------------------------------------
#
# Added because run 1 was underpowered, not because its numbers disappointed — the distinction §7.1 turns
# on. The sample sizes were visible at the flag step, before any outcome: poetry and scrapy left 10 and 13
# flagged files after stratification, where the power simulation says ~60 per side is needed to see a
# 1.5x effect. Run 1 stays on record and is reported alongside; nothing is replaced.
#
# Chosen for scored-file count, still with no prior contact, still spanning conventions and languages.

[[repo]]
name = "pandas"
url = "https://github.com/pandas-dev/pandas"
head = "v3.0.5"
paths = { python = ["pandas"] }
run = 2

[[repo]]
name = "ansible"
url = "https://github.com/ansible/ansible"
head = "v2.21.2"
paths = { python = ["lib/ansible"] }
run = 2

[[repo]]
name = "homeassistant"
url = "https://github.com/home-assistant/core"
head = "2026.7.4"
paths = { python = ["homeassistant"] }
run = 2

[[repo]]
name = "angular"
url = "https://github.com/angular/angular"
head = "v22.1.0"
paths = { ts = ["packages"] }
run = 2

# --- run 3 (2026-08-01) -------------------------------------------------------------------
#
# One repository, chosen to answer the specific limitation run 2 left open rather than to add volume.
#
# Run 2's pass (home-assistant) is a plugin registry: `homeassistant/components/*` is thousands of largely
# independent integration modules. Its near-miss (angular) is a coupled framework, and its flagged files
# showed no specificity to defects. Those differ in two ways at once — architecture and language — so
# neither explains the other.
#
# sympy holds the language fixed (Python, like home-assistant) and changes the architecture: a symbolic
# mathematics core with deep internal coupling, nothing like a plugin registry.
#
# PREDICTION, recorded before running (see RESULTS.md "Run 3" for what each outcome licenses).

# sympy was the first choice and was EXCLUDED AT THE FLAG STEP, before any outcome: 23 flagged files
# against the >=60 the power bar above requires. A blind exclusion on a criterion fixed in advance, the
# same handling flask got in run 1. Kept here rather than deleted.
#
# [[repo]] name = "sympy" url = "https://github.com/sympy/sympy" head = "1.14.0"
#          paths = { python = ["sympy"] }   -> 23 flagged of 354 scored, underpowered
#
# nova replaces it and answers the same pre-registered question: a large, deeply coupled Python service
# (a scheduler, compute manager and API sharing state through a common object layer), not a plugin
# registry. Language held fixed against home-assistant; architecture changed.

[[repo]]
name = "nova"
url = "https://github.com/openstack/nova"
head = "33.0.2"
paths = { python = ["nova"] }
run = 3

# --- run 4 (2026-08-01) -------------------------------------------------------------------
#
# After run 3, architecture is ruled out as the explanation for the split: nova is deeply coupled, not a
# plugin registry, and passes with the same specificity signature as home-assistant. Both passes are
# Python; the one near-miss without specificity (angular) is TypeScript — and it is the only TypeScript
# datapoint, carrying that whole question alone.
#
# kibana is TypeScript, of a different kind from angular: a large application/platform rather than a
# framework, different domain, different conventions, no prior contact.
#
# PREDICTION recorded before running — see RESULTS.md "Run 4".

[[repo]]
name = "kibana"
url = "https://github.com/elastic/kibana"
head = "v9.4.4"
paths = { ts = ["src"] }
run = 4
